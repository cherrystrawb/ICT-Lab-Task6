```html
<!DOCTYPE html>
<html lang="en">
<head>

<title>Continental Hotel Reservation Form</title>

<style>

body {background-color: #e0e0e0;}
h1
{color: red;
font-family: Arial, sans-serif;
font-size: 18px;
text-align: center;
margin: 28px 0 20px;}

form {width: 440px;}

table
{width: 440px;
background-color: #cce5ff;
border: 2px ridge black;
border-spacing: 2px;}

th, td
{border: 1px solid #808080;
padding: 5px;}
th {text-align: right;
width: 122px;}

input[type="text"],
input[type="email"],
input[type="tel"] {width: 196px;}

#arrival {width: 136px;}

#departure-date,
#departure-time {width: 136px;}
input {box-sizing: content-box;}

.submit-row {
text-align: center;
}
</style>
</head>

<body>
<form action="#" method="get">
<h1>Continental Hotel Reservation Form</h1>

<table>
<tr>
<th><label for="name">Name</label></th>
<td>
<input type="text" id="name" name="name"
placeholder="Enter your name">
</td>
</tr>

<tr>
<th><label for="email">eMail</label></th>
<td>
<input type="email" id="email" name="email"
value="info@continental.pk">
</td>
</tr>

<tr>
<th><label for="mobile">Mobile No</label></th>
<td>
<input type="tel" id="mobile" name="mobile"
placeholder="Enter your cell number">
</td>
</tr>

<tr>
<th><label for="arrival">Arrival Time</label></th>
<td>
<input type="text" id="arrival" name="arrival"
placeholder="Enter your arrival time">
</td>
</tr>

<tr>
<th><label for="departure-date">Departure</label></th>
<td>
<input type="text" id="departure-date"
name="departure_date" aria-label="Departure date">
<input type="text" id="departure-time"
name="departure_time" aria-label="Departure time">
</td>
</tr>

<tr>
<th>Room Type</th>
<td>
<label>
<input type="radio" name="room_type" value="single">Single
</label>

<label>
<input type="radio" name="room_type" value="double">Double
</label>
<br>

<label>
<input type="radio" name="room_type"
value="presidential_suite">Presidential Suite
</label>
</td>
</tr>

<tr>
<th>Preferences</th>
<td>
<label>
<input type="checkbox" name="preferences"
value="non_smoking">Non-Smoking
</label>
<br>

<label>
<input type="checkbox" name="preferences"
value="internet">Internet
</label>
<br>

<label>
<input type="checkbox" name="preferences"
value="firm_mattress">Firm Mattress
</label>
</td>
</tr>

<tr>
<th>Mode of Payment</th>
<td>
<label>
<input type="checkbox" name="payment" value="cash">Cash
</label>

<label>
<input type="checkbox" name="payment" value="check">Check
</label>
<br>

<label>
<input type="checkbox" name="payment"
value="credit_card">Credit Card
</label>

<select name="card" aria-label="Select Card">
<option value="">Select Card</option>
<option value="visa">Visa</option>
<option value="mastercard">MasterCard</option>
</select>
</td>
</tr>

<tr>
<td colspan="2" class="submit-row">
<input type="submit" value="Send Data">
</td>
</tr>
</table>
</form>
</body>
</html>
```
